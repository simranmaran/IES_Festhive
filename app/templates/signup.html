{% extends 'base.html' %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-100 px-6">

  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md border border-yellow-600">

    <h2 class="text-2xl font-semibold text-center mb-6">
      Create Your Account
    </h2>

    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <input type="text" name="username" placeholder="Username" required
        class="w-full p-2 border rounded">

      <input type="email" name="email" placeholder="Email" required
        class="w-full p-2 border rounded">

      <input type="password" name="password" placeholder="Password" required
        class="w-full p-2 border rounded">

      <button type="submit"
        class="w-full bg-gradient-to-r from-purple-600 to-yellow-700 text-white py-2 rounded-lg hover:scale-105 transition">
        Sign Up
      </button>
    </form>

    <p class="text-center mt-4">
      Already have an account?
      <a href="{% url 'login' %}" class="text-yellow-600 font-semibold">Login</a>
    </p>

  </div>
</div>

{% endblock %}
