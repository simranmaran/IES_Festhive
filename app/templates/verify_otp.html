{% extends 'base.html' %}
{% block content %}

<div class="min-h-screen flex justify-center items-center">
  <form method="POST" class="bg-white p-8 rounded shadow w-96">
    {% csrf_token %}
    <h2 class="text-2xl font-bold mb-4">Verify OTP</h2>

    <input name="otp"
           placeholder="Enter OTP"
           class="w-full p-2 border mb-4" required>

    <button class="w-full bg-green-600 text-white py-2 rounded">
      Verify
    </button>
  </form>
</div>

{% endblock %}
