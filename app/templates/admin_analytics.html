{% extends 'base.html' %}
{% block content %}

<div class="p-10">
  <h2 class="text-4xl font-bold text-center mb-10 text-yellow-600">
    📊 Admin Analytics Dashboard
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

    <div class="bg-white shadow rounded p-6 text-center">
      <h3 class="text-xl font-semibold">Total Users</h3>
      <p class="text-4xl font-bold text-blue-600 mt-2">
        {{ total_users }}
      </p>
    </div>

    <div class="bg-white shadow rounded p-6 text-center">
      <h3 class="text-xl font-semibold">Total Events</h3>
      <p class="text-4xl font-bold text-green-600 mt-2">
        {{ total_events }}
      </p>
    </div>

    <div class="bg-white shadow rounded p-6 text-center">
      <h3 class="text-xl font-semibold">Total Registrations</h3>
      <p class="text-4xl font-bold text-yellow-600 mt-2">
        {{ total_registrations }}
      </p>
    </div>

    <div class="bg-white shadow rounded p-6 text-center">
      <h3 class="text-xl font-semibold">Volunteers</h3>
      <p class="text-4xl font-bold text-purple-600 mt-2">
        {{ total_volunteers }}
      </p>
    </div>

    <div class="bg-white shadow rounded p-6 text-center md:col-span-2">
      <h3 class="text-xl font-semibold">Feedback Received</h3>
      <p class="text-4xl font-bold text-red-600 mt-2">
        {{ total_feedbacks }}
      </p>
    </div>

  </div>
</div>

{% endblock %}
