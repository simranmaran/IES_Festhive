{% extends 'base.html' %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-800 via-indigo-900 to-gray-900 p-10">

  <div class="w-full max-w-2xl bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-10 shadow-2xl text-white">

    <h2 class="text-4xl font-bold text-center bg-gradient-to-r from-fuchsia-400 via-purple-400 to-teal-300 text-transparent bg-clip-text mb-6">
      ⭐ Share Your Feedback
    </h2>

    {% if message %}
    <div class="bg-green-600 p-3 rounded-lg text-center mb-5">
      {{ message }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-5">
      {% csrf_token %}

      <input type="text" name="name" placeholder="Full Name" required
        class="w-full p-3 rounded bg-white text-black">

      <input type="email" name="email" placeholder="Email" required
        class="w-full p-3 rounded bg-white text-black">

      <select name="rating" required
        class="w-full p-3 rounded bg-white text-black">
        <option value="">Rate Event</option>
        <option value="1">⭐ Poor</option>
        <option value="2">⭐⭐ Fair</option>
        <option value="3">⭐⭐⭐ Good</option>
        <option value="4">⭐⭐⭐⭐ Very Good</option>
        <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
      </select>

      <textarea name="comments" rows="3" placeholder="Your Comments" required
        class="w-full p-3 rounded bg-white text-black"></textarea>

      <textarea name="suggestions" rows="3" placeholder="Suggestions" required
        class="w-full p-3 rounded bg-white text-black"></textarea>

      <button type="submit"
        class="w-full py-3 bg-orange-600 hover:bg-orange-700 transition rounded-lg font-bold">
        Submit Feedback
      </button>

    </form>

  </div>
</div>

{% endblock %}
