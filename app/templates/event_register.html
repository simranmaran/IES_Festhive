{% extends 'base.html' %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-800 via-indigo-900 to-gray-900 p-10">

  <div class="w-full max-w-2xl bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-10 shadow-2xl text-white">

    <h2 class="text-4xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-pink-400 to-fuchsia-400 mb-8">
      College Event Registration
    </h2>

    <form method="POST" class="space-y-5">
      {% csrf_token %}

      <!-- Full Name -->
      <div>
        <label class="block text-sm font-medium mb-1">Full Name</label>
        <input type="text" name="full_name" required
          class="w-full px-4 py-3 rounded-xl bg-white text-black border focus:ring-2 focus:ring-pink-400">
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" name="email" required
          class="w-full px-4 py-3 rounded-xl bg-white text-black border focus:ring-2 focus:ring-pink-400">
      </div>

      <!-- Phone -->
      <div>
        <label class="block text-sm font-medium mb-1">Phone Number</label>
        <input type="text" name="phone" maxlength="10" required
          class="w-full px-4 py-3 rounded-xl bg-white text-black border focus:ring-2 focus:ring-pink-400">
      </div>

      <!-- College -->
      <div>
        <label class="block text-sm font-medium mb-1">College / University</label>
        <input type="text" name="college" required
          class="w-full px-4 py-3 rounded-xl bg-white text-black border focus:ring-2 focus:ring-pink-400">
      </div>

      <!-- Course -->
      <div>
        <label class="block text-sm font-medium mb-1">Course & Year</label>
        <input type="text" name="course_year" required
          class="w-full px-4 py-3 rounded-xl bg-white text-black border focus:ring-2 focus:ring-pink-400">
      </div>

      <!-- Event -->
      <div>
        <label class="block text-sm font-medium mb-1">Select Event</label>
        <select name="event" required
          class="w-full px-4 py-3 rounded-xl bg-white text-black border focus:ring-2 focus:ring-pink-400">
          <option value="">-- Select Event --</option>
          {% for event in events %}
          <option value="{{ event.id }}">{{ event.title }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Team -->
      <div>
        <label class="block text-sm font-medium mb-1">Team Name (optional)</label>
        <input type="text" name="team_name"
          class="w-full px-4 py-3 rounded-xl bg-white text-black border focus:ring-2 focus:ring-pink-400">
      </div>

      <!-- Terms -->
      <div class="flex gap-2">
        <input type="checkbox" required>
        <span class="text-sm">I agree to the Terms & Conditions</span>
      </div>

      <!-- Button -->
      <button type="submit"
        class="w-full py-3 bg-gradient-to-r from-orange-500 to-orange-600 hover:scale-105 transition text-white font-bold rounded-xl shadow-lg">
        Register Now
      </button>

    </form>

  </div>
</div>

{% endblock %}
